name: Compile Sonic Mania 3DS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # Pin to a stable Linux image to prevent environmental shifting
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Install System Dependencies & devkitPro Tools
        run: |
          # 1. Update system databases and install basic build tools
          sudo apt-get update
          sudo apt-get install -y build-essential git wget make

          # 2. Download and run the official devkitPro installer tool directly
          wget -U "dkp-apt" https://devkitpro.org
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman --noconfirm

          # 3. Explicitly install the specific 3DS architecture and rendering libraries
          sudo /opt/devkitpro/pacman/bin/pacman -S 3ds-dev libctru 3ds-sdl 3ds-libtheora --noconfirm

      - name: Download Repositories & Compile
        run: |
          # Set devkitPro tracking folders inside the active script instance
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM

          # 1. Download the core game source trees safely
          git clone https://github.com
          git clone https://github.com --recursive
          
          # 2. Switch to the 3DS platform code branch
          cd RSDKv5-Decompilation
          git checkout 3ds-main
          rm -rf Game
          
          # 3. Align the game modules
          cd ../Sonic-Mania-Decompilation
          mv SonicMania ../RSDKv5-Decompilation/Game
          
          # 4. Inject the C++ compilation overrides and link targets safely into the Makefile configuration
          cd ../RSDKv5-Decompilation
          sed -i 's|CXXFLAGS\s*:=|CXXFLAGS := -fexceptions -DRETRO_USE_PLUS -DREV02 |g' Makefile
          sed -i 's|CFLAGS\s*:=|CFLAGS := -DRETRO_USE_PLUS -DREV02 |g' Makefile
          sed -i 's|LD\s*:=\s*\$(CC)|LD := $(CXX)|g' Makefile
          
          # 5. Execute compilation using the standard hardware target variables natively
          make PLATFORM=3DS

      - name: Upload Finished Executable Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Mania-3DS-Executable
          path: RSDKv5-Decompilation/bin/3DS/CTR/sonicmania.3dsx

