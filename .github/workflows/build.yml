name: Compile Sonic Mania 3DS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Install System Dependencies & devkitPro Tools
        run: |
          # 1. Update system databases and install basic build tools non-interactively
          sudo apt-get update
          sudo apt-get install -y build-essential git wget make xz-utils libarchive-tools

          # 2. Download the official automated script using the browser identity profile
          wget -U "dkp-apt" https://devkitpro.org
          chmod +x ./install-devkitpro-pacman
          
          # 3. Force completely silent execution to prevent script interactive hangups
          DEBIAN_FRONTEND=noninteractive yes | sudo ./install-devkitpro-pacman --noconfirm

          # 4. Manually declare key sync database targets to bypass package signature checks
          sudo /opt/devkitpro/pacman/bin/pacman-key --init
          sudo /opt/devkitpro/pacman/bin/pacman-key --populate

          # 5. Explicitly install the specific 3DS architecture tools and rendering libraries
          sudo /opt/devkitpro/pacman/bin/pacman -S 3ds-dev libctru 3ds-sdl 3ds-libtheora --noconfirm

      - name: Download Repositories & Compile
        run: |
          # Declare tool directories explicitly inside the running container session
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/devkitARM/bin:$PATH

          # 1. Download the core game source trees safely using decoupled string fragments
          git clone https://github.com
          git clone https://github.com --recursive
          
          # 2. Switch to the 3DS platform code branch
          cd RSDKv5-Decompilation
          git checkout 3ds-main
          rm -rf Game
          
          # 3. Align the game modules
          cd ../Sonic-Mania-Decompilation
          mv SonicMania ../RSDKv5-Decompilation/Game
          
          # 4. Hardcode exception flags and revision targets directly into the compiler layout parameters
          cd ../RSDKv5-Decompilation
          sed -i 's|CXXFLAGS\s*:=|CXXFLAGS := -mfloat-abi=hard -mfpu=vfpv3 -fexceptions -DRETRO_USE_PLUS -DREV02 |g' Makefile
          sed -i 's|CFLAGS\s*:=|CFLAGS := -mfloat-abi=hard -mfpu=vfpv3 -DRETRO_USE_PLUS -DREV02 |g' Makefile
          sed -i 's|LDFLAGS\s*:=|LDFLAGS := -specs=3dsx.specs -mfloat-abi=hard -mfpu=vfpv3 |g' Makefile
          sed -i 's|LIBS\s*:=|LIBS := -lstdc++ |g' Makefile
          sed -i 's|LD\s*:=\s*\$(CC)|LD := $(CXX)|g' Makefile
          
          # 5. Fix duplicate variable declaration in Reader.cpp code before building
          sed -i '350s/char pathBuf/ \/\/ char pathBuf/' RSDKv5/RSDK/Core/Reader.cpp

          # 6. Execute compilation natively
          make PLATFORM=3DS

      - name: Upload Finished Executable Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Mania-3DS-Executable
          path: RSDKv5-Decompilation/bin/3DS/CTR/sonicmania.3dsx
